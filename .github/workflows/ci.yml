name: WebAudit 360 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webaudit
          POSTGRES_PASSWORD: webaudit_secret_pass
          POSTGRES_DB: webaudit360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js for Lighthouse CLI & axe-core
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://webaudit:webaudit_secret_pass@localhost:5432/webaudit360
          SECRET_KEY: test_secret_key_ci_environment_32chars_long!
        run: |
          alembic upgrade head

      - name: Execute Pytest Suite with Coverage
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          SECRET_KEY: test_secret_key_ci_environment_32chars_long!
          DEBUG: "true"
        run: |
          pytest -v --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml

  docker-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build WebAudit 360 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: webaudit360:latest

