<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — WebAudit 360</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('webaudit360_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="nav-brand">
        <span data-icon="globe" data-icon-class="gradient-text"></span>
        <span>WebAudit <span class="gradient-text">360</span></span>
      </a>

      <div class="nav-actions">
        <div class="theme-toggle-capsule" role="button" tabindex="0" aria-label="Toggle Theme">
          <div class="theme-toggle-option active" data-theme-val="light"><span data-icon="sun"></span></div>
          <div class="theme-toggle-option" data-theme-val="dark"><span data-icon="moon"></span></div>
        </div>
        <a href="register.html" class="btn btn-secondary btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <!-- Login Form Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-2xl) var(--space-md);">
    <div class="glass-panel" style="max-width: 440px; width: 100%; padding: var(--space-2xl);">
      <div style="text-align: center; margin-bottom: var(--space-xl);">
        <div style="width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--accent-glow); color: var(--accent-primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: var(--space-sm);">
          <span data-icon="shield"></span>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 700;">Sign in to WebAudit 360</h1>
        <p class="small-text text-muted" style="margin-top: 4px;">Access your audit history, projects, and monitoring alerts</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="developer@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between">
            <label for="password" class="form-label">Password</label>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary w-full" style="margin-top: var(--space-md);">
          <span data-icon="shield"></span>
          <span>Sign In</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-lg); font-size: 0.875rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--accent-primary); font-weight: 600;">Create an account</a>
      </div>
    </div>
  </main>

  <footer style="text-align: center; padding: var(--space-md); font-size: 0.8125rem; color: var(--text-muted); border-top: 1px solid var(--border-color);">
    &copy; <span id="footer-year">2026</span> WebAudit 360. All Rights Reserved. Made by Harsh Patel.
  </footer>

  <script type="module">
    import { renderIcons } from "./js/icons.js";
    import { initTheme } from "./js/theme.js";
    import { auth } from "./js/auth.js";
    import { showToast, initFooterYear } from "./js/utils.js";

    document.addEventListener("DOMContentLoaded", () => {
      renderIcons();
      initTheme();
      initFooterYear();

      if (auth.isAuthenticated()) {
        window.location.href = "dashboard.html";
      }

      const form = document.getElementById("login-form");
      const submitBtn = document.getElementById("login-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        submitBtn.classList.add("is-loading");
        try {
          await auth.login(email, password);
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        } catch (err) {
          showToast("Authentication Failed", err.message || "Invalid credentials", "error");
        } finally {
          submitBtn.classList.remove("is-loading");
        }
      });
    });
  </script>
</body>
</html>
